# EAS build trigger skeleton — manual dispatch only until EXPO_TOKEN + EAS project id exist.
name: eas-build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options: [development, staging, production]
      platform:
        description: Platform
        required: true
        type: choice
        options: [all, ios, android]
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Kagaz install from GitHub Packages (see quality.yml). The EAS build server needs the same
      # value as an EAS secret/env var named GITHUB_PACKAGES_TOKEN.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.KAGAZ_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: eas build --non-interactive --no-wait --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}
